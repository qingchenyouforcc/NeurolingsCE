[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/assets",
    "crates/engine",
    "crates/runtime",
    "crates/platform",
    "crates/ipc",
    "crates/http",
    "crates/codex",
    "crates/store",
    "crates/update",
    "crates/auth",
    "crates/submission",
    "crates/services",
    "crates/ui",
    "crates/cli",
    "crates/app",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "GPL-3.0-only"
publish = false

[workspace.dependencies]
api = { path = "crates/api" }
assets = { path = "crates/assets" }
engine = { path = "crates/engine" }
runtime = { path = "crates/runtime" }
platform = { path = "crates/platform" }
ipc = { path = "crates/ipc" }
http = { path = "crates/http" }
codex = { path = "crates/codex" }
store = { path = "crates/store" }
update = { path = "crates/update" }
auth = { path = "crates/auth" }
submission = { path = "crates/submission" }
services = { path = "crates/services" }
ui = { path = "crates/ui" }
cli = { path = "crates/cli" }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
