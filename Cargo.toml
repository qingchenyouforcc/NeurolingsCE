[workspace]
resolver = "2"
members = [
    "crates/schema",
    "crates/tool",
    "crates/player",
    "crates/doll",
    "crates/stage",
    "crates/host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
winit = "0.30"
image = "0.25"
quick-xml = { version = "0.37", features = ["serialize"] }
