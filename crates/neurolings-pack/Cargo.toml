[package]
name = "neurolings-pack"
description = ".mascot package format, legacy Shimeji-ee archive import, path safety"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neurolings-common.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
roxmltree = "0.20"
tempfile = "3"
walkdir = "2"
zip = { version = "5", default-features = false, features = ["deflate"] }
unrar = "0.5"
tar = { version = "0.4", default-features = false }
flate2 = "1"
sevenz-rust2 = { version = "0.21", features = ["util", "aes256"] }
