[package]
name = "neurolings-platform"
description = "OS abstraction: transparent topmost windows, active window tracking, autostart, credentials"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neurolings-common.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security",
] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["xfixes", "shape"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSData", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSWindow",
    "NSPanel",
    "NSView",
    "NSScreen",
    "NSImage",
    "NSEvent",
    "NSBitmapImageRep",
    "NSGraphics",
    "NSColor",
    "NSResponder",
    "NSImageView",
    "NSRunningApplication",
] }
