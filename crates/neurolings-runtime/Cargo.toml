[package]
name = "neurolings-runtime"
description = "Desktop runtime daemon: mascot windows, tick loop, IPC/HTTP services, tray"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "NeurolingsCE"
path = "src/main.rs"

[dependencies]
neurolings-common.workspace = true
neurolings-engine.workspace = true
neurolings-pack.workspace = true
neurolings-platform.workspace = true
neurolings-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
include_dir = "0.7"
rodio = "0.22.2"
base64 = "0.22"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.20"
muda = "0.16"

[dev-dependencies]
tempfile = "3"
