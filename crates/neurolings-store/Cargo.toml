[package]
name = "neurolings-store"
description = "Mascot store client: index, cache, download, GitHub device-flow login, submission"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
neurolings-common.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json", "tls"] }
keyring = { version = "3", optional = true }

[features]
default = ["keyring"]
keyring = ["dep:keyring"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Security_Credentials", "Win32_Foundation", "Win32_System_Registry"] }
